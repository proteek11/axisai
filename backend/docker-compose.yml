version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: axis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axisdev}
      POSTGRES_DB: ${POSTGRES_DB:-axis_ai}
    ports:
      - "5432:5432"
    volumes:
      - axis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axis} -d ${POSTGRES_DB:-axis_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: axis_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redisdev}
    ports:
      - "6379:6379"
    volumes:
      - axis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisdev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Qdrant ────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: axis_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrantdev}
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - axis_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Axis AI API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axis_api
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./app:/app/app       # hot-reload in dev
      - axis_uploads:/tmp/axis_uploads
      - axis_video_outputs:/data/video_outputs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axis_worker
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - axis_uploads:/tmp/axis_uploads
      - axis_video_outputs:/data/video_outputs
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,priority,video,beat

  # ── Celery Beat (scheduled tasks) ─────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axis_beat
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      - worker
    volumes:
      - ./app:/app/app
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # ── Flower (Celery monitoring) ─────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axis_flower
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "5555:5555"
    depends_on:
      - worker
    command: celery -A app.tasks.celery_app flower --port=5555

volumes:
  axis_postgres_data:
  axis_redis_data:
  axis_qdrant_data:
  axis_uploads:
  axis_video_outputs:
