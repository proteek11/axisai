[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axis-ai"
version = "0.1.0"
description = "AI content intelligence engine for Moodle LMS"
requires-python = ">=3.11"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # --- Settings & validation ---
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",

    # --- Task queue ---
    "celery[redis]>=5.4.0",
    "redis[hiredis]>=5.0.0",

    # --- Vector DB ---
    "qdrant-client[fastembed]>=1.9.0",

    # --- AI (unified provider interface) ---
    "litellm>=1.40.0",

    # --- Content extraction ---
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "yt-dlp>=2024.5.0",
    "youtube-transcript-api>=0.6.2",
    "trafilatura>=1.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "httpx>=0.27.0",

    # --- Chunking ---
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.7.0",

    # --- Logging & observability ---
    "structlog>=24.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # --- Utilities ---
    "tenacity>=8.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "aiofiles>=23.2.0",
    "python-slugify>=8.0.0",
    "orjson>=3.10.0",

    # ── Video creation pipeline ───────────────────────────────────────────────
    # Install system packages first: apt-get install -y ffmpeg libreoffice-headless
    # fonts-liberation fonts-noto fonts-open-sans
    "moviepy>=1.0.3",              # Video assembly, transitions, text overlays
    "imageio[ffmpeg]>=2.34.0",     # FFmpeg I/O backend for MoviePy
    "imageio-ffmpeg>=0.5.0",       # Bundles FFmpeg binary (fallback if system ffmpeg absent)
    "edge-tts>=6.1.9",             # FREE Microsoft TTS — 400+ neural voices, no API key
    "pydub>=0.25.1",               # Audio mixing, volume ducking, format conversion
    "python-pptx>=1.0.0",          # Generate .pptx from LLM outline (presentation type)
    "boto3>=1.34.0",               # S3 upload (only active when VIDEO_STORAGE=s3)
    "cryptography>=42.0.0",        # AES-256 encryption of per-tenant provider API keys

    # ── Reports ───────────────────────────────────────────────────────────────
    "reportlab>=4.0.0",            # PDF generation for report exports
    "jinja2>=3.1.0",               # HTML template rendering (report PDFs)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipython>=8.24.0",
]
whisper = [
    "openai-whisper>=20231117",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008", "N805"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = ["ENV=test"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
