# Nginx vhost for axis.edzlms.com (Next.js frontend)
# Place at: /etc/nginx/sites-available/axis-frontend
# Enable:   sudo ln -sf /etc/nginx/sites-available/axis-frontend /etc/nginx/sites-enabled/axis-frontend
# SSL:      sudo certbot --nginx -d axis.edzlms.com
# Reload:   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name axis.edzlms.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS — main server block ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name axis.edzlms.com;

    # SSL — managed by Certbot (do NOT edit these lines manually)
    ssl_certificate     /etc/letsencrypt/live/axis.edzlms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axis.edzlms.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Upload size limit — allow video files up to 500 MB
    client_max_body_size 500m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Next.js static assets — aggressive caching, hashed filenames ──────────
    # IMPORTANT: this MUST be before location / or Nginx will never reach it
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Public folder (favicon, images, etc.) ────────────────────────────────
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }


    # ── File uploads — large body, no buffering, longer timeout ─────────────
    location /api/spaces/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # ── All other requests → Next.js ──────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
